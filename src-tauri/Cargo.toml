[package]
name = "persona-desktop"
version = "0.4.0"
description = "Persona desktop companion"
authors = ["Persona contributors"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "system-proxy"] }
tokio = { version = "1", features = ["sync", "macros", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_System_SystemInformation"] }
windows = { version = "0.62.2", features = ["Media_Control", "Foundation_Collections", "Win32_System_WinRT"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
