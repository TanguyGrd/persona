<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Persona — bac à sable</title>
  <link rel="stylesheet" href="playground.css">
</head>
<body>
  <main>
    <h1>Bac à sable Persona</h1>
    <p>Le moteur sans Chrome : la même scène que l’extension, avec un stockage <code>localStorage</code>. C’est aussi la base du futur hôte Windows (une fenêtre web transparente).</p>
    <div class="row">
      <button data-cmd="talk">Parler</button>
      <button data-cmd="hide">Masquer / afficher</button>
      <button data-cmd="peek">Entrée « peek »</button>
      <button data-cmd="hop">Entrée « hop »</button>
      <button data-cmd="pop">Entrée « pop »</button>
      <button data-cmd="reset">Effacer les données</button>
    </div>
  </main>
  <script src="playground.js" type="module"></script>
</body>
</html>
